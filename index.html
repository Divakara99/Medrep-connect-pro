<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- All icons below are generated from src/assets/logo.svg (npm run icons). -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b4efb" />
    <meta name="description" content="India's 1st pharma-job network." />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <!-- One-line app name so mobile browser tabs and PWA titles never wrap. -->
    <title>MedRep Connect Pro</title>
  </head>
  <body>
    <div id="root"><div role="status" style="min-height:100vh;display:grid;place-items:center;background:#eef5ff;color:#1a328f;font:700 18px/1.5 system-ui,sans-serif;text-align:center;padding:24px">Loading your account…</div></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
