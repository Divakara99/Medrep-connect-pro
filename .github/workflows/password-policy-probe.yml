# TEMPORARY Arena-session tooling — removed again before the merge.
# Publishes the hosted Supabase Auth password-policy probe as a job summary and
# a pull-request comment so the coding sandbox can read the result.
name: Password policy probe (temporary)

on:
  push:
    branches:
      - 'arena/d359bb0c-medrep-connect-pro'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://lmhmbrusjizncumrufsx.supabase.co
      # Public publishable key — it already ships in the browser bundle.
      SUPABASE_ANON_KEY: sb_publishable_4uiy6UZHkIjzAZssMfLWKQ_TwG6x7fC
      PROBE_EMAIL: arena-password-check@example.com
    steps:
      - name: Probe the hosted Supabase Auth password policy
        run: |
          set -u
          : > /tmp/evidence.md
          report() { echo "$1" | tee -a /tmp/evidence.md; }
          report '## Hosted Supabase Auth password policy (production project)'
          report ''
          report 'Sign-up calls, exactly as the app performs them (`POST /auth/v1/signup`):'
          report ''
          echo '```' >> /tmp/evidence.md

          # 1) A 1-character password can never be accepted: this only reports the
          #    configured minimum length and creates no account.
          code=$(curl -sS -o /tmp/probe1.json -w '%{http_code}' -X POST "$SUPABASE_URL/auth/v1/signup" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"email":"arena-policy-probe@example.com","password":"a"}')
          report "1-character password      -> HTTP $code"
          report "  $(grep -o '"error_code":"[^"]*"\|"msg":"[^"]*"\|"message":"[^"]*"' /tmp/probe1.json | tr '\n' ' ')"

          # 2) The real thing: 6 characters, and a deliberately common password so
          #    the same call also proves leaked-password protection is not
          #    rejecting short-but-valid passwords.
          code=$(curl -sS -o /tmp/probe2.json -w '%{http_code}' -X POST "$SUPABASE_URL/auth/v1/signup" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$PROBE_EMAIL\",\"password\":\"abc123\",\"data\":{\"name\":\"Arena 6-character check (safe to delete)\"}}")
          report "6-character password      -> HTTP $code"
          report "  $(grep -o '"error_code":"[^"]*"\|"msg":"[^"]*"\|"message":"[^"]*"\|"id":"[^"]*"' /tmp/probe2.json | tr '\n' ' ')"
          if [ "$code" = "422" ]; then
            report '  (user_already_exists here means an earlier 6-character sign-up with abc123 was accepted)'
          fi

          # 3) The probe account proved the policy; make sure no usable weak
          #    credential is left behind. The random value is never printed.
          code=$(curl -sS -o /tmp/signin.json -w '%{http_code}' -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_ANON_KEY" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$PROBE_EMAIL\",\"password\":\"abc123\"}")
          report "sign-in with abc123       -> HTTP $code"
          report "  $(grep -o '"error_code":"[^"]*"\|"msg":"[^"]*"\|"message":"[^"]*"' /tmp/signin.json | tr '\n' ' ')"
          token=$(grep -o '"access_token":"[^"]*"' /tmp/signin.json | head -1 | cut -d'"' -f4)
          if [ -z "${token:-}" ]; then
            token=$(grep -o '"access_token":"[^"]*"' /tmp/probe2.json | head -1 | cut -d'"' -f4)
          fi
          if [ -n "${token:-}" ]; then
            random=$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 40)
            code=$(curl -sS -o /tmp/lock.json -w '%{http_code}' -X PUT "$SUPABASE_URL/auth/v1/user" \
              -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json' -d "{\"password\":\"$random\"}")
            report "rotate probe password     -> HTTP $code (random 40-character password, never printed)"
          else
            report 'rotate probe password     -> no session available, nothing to rotate'
          fi
          echo '```' >> /tmp/evidence.md
          cat /tmp/evidence.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the result as a pull-request comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          {
            echo 'Temporary password-policy probe (workflow removed again before merge).'
            echo
            cat /tmp/evidence.md 2>/dev/null || echo 'no evidence collected'
          } > /tmp/comment.md
          cat /tmp/comment.md
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          if [ -n "${number:-}" ]; then
            gh pr comment "$number" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
          else
            echo 'no open pull request for this branch; job summary only'
          fi
