name: Android (MedRep Pro)

# Produces:
#   - a debug APK you can install on your phone (every run), and
#   - a signed release AAB for Google Play (when the signing secrets exist).
# The release job SKIPS (does not fail) until ANDROID_KEYSTORE_BASE64 and the
# other secrets in ANDROID.md are added, so forks/PRs stay green.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  debug-apk:
    name: Debug APK (installable on a phone)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages (API 36)
        # GitHub's Ubuntu images ship the Android SDK (platform 36 included on
        # current images). Best-effort install of anything missing: Gradle can
        # fetch missing components itself once licences are accepted, so a
        # sdkmanager hiccup must not fail the build before Gradle even runs.
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" || echo "::warning::sdkmanager install skipped/failed — Gradle will fetch what it needs"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build web bundle
        run: npm run build
      - name: Sync into Android
        run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: medrep-pro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  release-aab:
    name: Signed release AAB (Google Play)
    runs-on: ubuntu-latest
    # Signing secrets are optional in this repo; skip cleanly without them.
    if: ${{ vars.ANDROID_SIGNING_CONFIGURED == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages (API 36)
        # GitHub's Ubuntu images ship the Android SDK (platform 36 included on
        # current images). Best-effort install of anything missing: Gradle can
        # fetch missing components itself once licences are accepted, so a
        # sdkmanager hiccup must not fail the build before Gradle even runs.
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" || echo "::warning::sdkmanager install skipped/failed — Gradle will fetch what it needs"
      - name: Install dependencies
        run: npm ci
      - name: Build web bundle
        run: npm run build
      - name: Sync into Android
        run: npx cap sync android
      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.p12" >> "$GITHUB_ENV"
      - name: Build release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
      - name: Verify the AAB is signed
        working-directory: android
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          # jarsigner alone can exit 0 for unsigned jars; require an actual
          # signature block in META-INF and a clean jarsigner verification.
          unzip -l "$AAB" | grep -Eq 'META-INF/[^ ]+\.(RSA|DSA|EC)' || {
            echo "::error::Release AAB has no signature — check the ANDROID_* secrets."
            exit 1
          }
          jarsigner -verify "$AAB"
          echo "Signed release AAB verified: $AAB"
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: medrep-pro-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
