# TEMPORARY Arena-session tooling — removed from the pull request before merge.
#
# The coding sandbox can only reach github.com/npm/pypi, so the production
# checks for the "6-character password" change run here and are published as a
# job summary plus a pull-request comment (both readable through the API):
#   1. the hosted Supabase Auth password policy (sign-up probes),
#   2. the bundle that https://medrepjob.netlify.app actually serves.
name: Password policy check (temporary)

on:
  push:
    branches:
      - 'arena/d359bb0c-medrep-connect-pro'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: https://lmhmbrusjizncumrufsx.supabase.co
      # Public publishable key — it already ships in the browser bundle.
      SUPABASE_ANON_KEY: sb_publishable_4uiy6UZHkIjzAZssMfLWKQ_TwG6x7fC
      LIVE_URL: https://medrepjob.netlify.app
      PROBE_EMAIL: arena-password-check@example.com
    steps:
      - name: Probe the hosted Supabase Auth password policy
        run: |
          set -u
          step=/tmp/step1.md
          : > "$step"
          report() { echo "$1" | tee -a "$step"; }
          report '## Hosted Supabase Auth password policy'
          report ''
          report 'Sign-up calls, exactly as the app performs them (`POST /auth/v1/signup`):'
          report ''
          echo '```' >> "$step"

          # A 1-character password can never be accepted, so this only reports
          # the configured minimum and creates no account.
          code=$(curl -sS -o /tmp/probe1.json -w '%{http_code}' -X POST "$SUPABASE_URL/auth/v1/signup" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"email":"arena-policy-probe@example.com","password":"a"}')
          report "1-character password  -> HTTP $code"
          report "  $(grep -o '"error_code":"[^"]*"\|"msg":"[^"]*"\|"message":"[^"]*"' /tmp/probe1.json | tr '\n' ' ')"

          # The real thing: a 6-character password. If an earlier run of this
          # check created the account, "already registered" is itself the proof
          # that a 6-character sign-up was accepted.
          code=$(curl -sS -o /tmp/probe2.json -w '%{http_code}' -X POST "$SUPABASE_URL/auth/v1/signup" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$PROBE_EMAIL\",\"password\":\"abc123\",\"data\":{\"name\":\"Arena 6-character check (safe to delete)\"}}")
          report "6-character password  -> HTTP $code"
          report "  $(grep -o '"error_code":"[^"]*"\|"msg":"[^"]*"\|"message":"[^"]*"\|"id":"[^"]*"' /tmp/probe2.json | tr '\n' ' ')"

          # The probe account proved the policy; make sure no usable weak
          # credential is left behind. The random value is never printed.
          code=$(curl -sS -o /tmp/signin.json -w '%{http_code}' -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_ANON_KEY" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$PROBE_EMAIL\",\"password\":\"abc123\"}")
          report "sign-in with abc123   -> HTTP $code (a non-200 means the weak password is already gone)"
          token=$(grep -o '"access_token":"[^"]*"' /tmp/signin.json | head -1 | cut -d'"' -f4)
          if [ -z "${token:-}" ]; then
            token=$(grep -o '"access_token":"[^"]*"' /tmp/probe2.json | head -1 | cut -d'"' -f4)
          fi
          if [ -n "${token:-}" ]; then
            random=$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 40)
            code=$(curl -sS -o /tmp/lock.json -w '%{http_code}' -X PUT "$SUPABASE_URL/auth/v1/user" \
              -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json' -d "{\"password\":\"$random\"}")
            report "probe account locked  -> HTTP $code (random 40-character password, never printed)"
          else
            report 'probe account locked  -> nothing to rotate (no session for the probe account)'
          fi
          echo '```' >> "$step"
          cat "$step" >> /tmp/evidence.md
          cat "$step" >> "$GITHUB_STEP_SUMMARY"

      - name: Snapshot the bundle the live site serves
        run: |
          set -u
          step=/tmp/step2.md
          : > "$step"
          report() { echo "$1" | tee -a "$step"; }
          report ''
          report '## Live site before the deploy'
          report ''
          echo '```' >> "$step"
          curl -sS "$LIVE_URL/sw.js" -o /tmp/sw.js
          report "sw.js cache: $(grep -o "CACHE = '[^']*'" /tmp/sw.js)"
          curl -sS "$LIVE_URL/" -o /tmp/index.html
          for asset in $(grep -o 'assets/[^"]*\.js' /tmp/index.html | sort -u); do
            curl -sS "$LIVE_URL/$asset" -o /tmp/live.js
            report "$asset"
            report "  'At least 6 characters': $(grep -c 'At least 6 characters' /tmp/live.js || true)"
            report "  'At least 12 characters': $(grep -c 'At least 12 characters' /tmp/live.js || true)"
            report "  vacancy-team 12-character message: $(grep -c 'The password must be at least 12 characters.' /tmp/live.js || true)"
          done
          echo '```' >> "$step"
          cat "$step" >> /tmp/evidence.md
          cat "$step" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the production deploy and verify the live bundle
        run: |
          set -u
          step=/tmp/step3.md
          : > "$step"
          report() { echo "$1" | tee -a "$step"; }
          report ''
          report '## Live site after the deploy'
          report ''
          echo '```' >> "$step"
          verified=0
          for attempt in $(seq 1 80); do
            six=0
            curl -sS "$LIVE_URL/" -o /tmp/index.html
            for asset in $(grep -o 'assets/[^"]*\.js' /tmp/index.html | sort -u); do
              curl -sS "$LIVE_URL/$asset" -o /tmp/live.js
              six=$(grep -c 'At least 6 characters' /tmp/live.js || true)
              twelve=$(grep -c 'At least 12 characters' /tmp/live.js || true)
              vacancy=$(grep -c 'The password must be at least 12 characters.' /tmp/live.js || true)
              if [ "$six" -ge 2 ] && [ "$twelve" -ge 1 ] && [ "$vacancy" -ge 1 ]; then
                verified=1
                report "deployed asset: $asset (seen on attempt $attempt)"
                report "  6-character text (sign-up + reset): $six"
                report "  admin 12-character text: $twelve"
                report "  vacancy-team 12-character message: $vacancy"
                curl -sS "$LIVE_URL/sw.js" -o /tmp/sw.js
                report "  sw.js cache: $(grep -o "CACHE = '[^']*'" /tmp/sw.js)"
              fi
            done
            if [ "$verified" = "1" ]; then
              report 'LIVE SITE VERIFIED'
              echo '```' >> "$step"
              cat "$step" >> /tmp/evidence.md
              cat "$step" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" = "80" ]; then
              report "TIMED OUT: the live bundle still has $six occurrence(s) of the 6-character text"
            fi
            sleep 20
          done
          echo '```' >> "$step"
          report 'TIMED OUT waiting for the deploy'
          cat "$step" >> /tmp/evidence.md
          cat "$step" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Publish the evidence as a pull-request comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          {
            echo 'Temporary verification for the 6-character password change — produced by the workflow that is removed from this pull request before merge.'
            echo
            cat /tmp/evidence.md 2>/dev/null || echo 'no evidence collected'
          } > /tmp/comment.md
          cat /tmp/comment.md
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          if [ -n "${number:-}" ]; then
            gh pr comment "$number" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
          else
            echo 'no open pull request for this branch; job summary only'
          fi
