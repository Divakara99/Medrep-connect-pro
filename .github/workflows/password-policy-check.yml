# TEMPORARY Arena-session tooling — deleted from the pull request before merge.
#
# The coding sandbox can only reach github.com/npm/pypi, so the two production
# checks for the "6-character password" change run here instead:
#   1. the hosted Supabase Auth password policy (sign-up probe),
#   2. the bundle that https://medrepjob.netlify.app actually serves.
name: Password policy check (temporary)

on:
  push:
    branches:
      - 'arena/d359bb0c-medrep-connect-pro'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: https://lmhmbrusjizncumrufsx.supabase.co
      # Public publishable key — it already ships in the browser bundle.
      SUPABASE_ANON_KEY: sb_publishable_4uiy6UZHkIjzAZssMfLWKQ_TwG6x7fC
      LIVE_URL: https://medrepjob.netlify.app
    steps:
      - name: Probe the hosted Supabase Auth password policy
        run: |
          set -u
          probe() {
            local label="$1" password="$2" email="$3" data="$4"
            echo "--- $label"
            curl -sS -o /tmp/probe.json -w 'HTTP %{http_code}\n' \
              -X POST "$SUPABASE_URL/auth/v1/signup" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"$email\",\"password\":\"$password\"$data}"
            sed -e 's/\(access_token":"\)[^"]*/\1<redacted>/' \
                -e 's/\(refresh_token":"\)[^"]*/\1<redacted>/' \
                -e 's/\(id":"\)[^"]*/\1<id>/' /tmp/probe.json
            echo
          }
          # A 1-character password can never be accepted, so this only reports
          # the configured minimum and creates no account.
          probe 'minimum length probe (1 character, no account created)' 'a' \
            'arena-policy-probe@example.com' ''
          # A real 6-character sign-up, exactly as the app performs it.
          probe '6-character sign-up probe (creates one labelled test account)' 'abc123' \
            'arena-password-check@example.com' ',"data":{"name":"Arena 6-character check (safe to delete)"}'

          # The probe account proved the policy; give it a long random password
          # so no usable weak credential is left behind. The value is never
          # printed. The account still shows in Admin → Users (delete it there).
          token=$(grep -o '"access_token":"[^"]*"' /tmp/probe.json | head -1 | cut -d'"' -f4)
          if [ -n "${token:-}" ]; then
            random=$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 40)
            curl -sS -o /tmp/lock.json -w 'lock probe account: HTTP %{http_code}\n' \
              -X PUT "$SUPABASE_URL/auth/v1/user" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json' \
              -d "{\"password\":\"$random\"}"
            grep -o '"msg":"[^"]*"\|"error_code":"[^"]*"' /tmp/lock.json || true
          fi

      - name: Snapshot the bundle the live site serves
        run: |
          set -u
          curl -sS "$LIVE_URL/" -o /tmp/index.html
          echo "live index.html:"
          grep -o 'assets/[^"]*\.js' /tmp/index.html | sort -u
          for asset in $(grep -o 'assets/[^"]*\.js' /tmp/index.html | sort -u); do
            curl -sS "$LIVE_URL/$asset" -o /tmp/live.js
            echo "--- $asset"
            echo "At least 6 characters: $(grep -c 'At least 6 characters' /tmp/live.js || true)"
            echo "At least 12 characters: $(grep -c 'At least 12 characters' /tmp/live.js || true)"
            echo "vacancy team 12-char message: $(grep -c 'The password must be at least 12 characters.' /tmp/live.js || true)"
          done

      - name: Wait for the production deploy and verify the live bundle
        run: |
          set -u
          for attempt in $(seq 1 80); do
            curl -sS "$LIVE_URL/" -o /tmp/index.html
            found=0
            for asset in $(grep -o 'assets/[^"]*\.js' /tmp/index.html | sort -u); do
              curl -sS "$LIVE_URL/$asset" -o /tmp/live.js
              if grep -q 'At least 6 characters' /tmp/live.js; then
                found=1
                echo "deployed asset: $asset (attempt $attempt)"
                echo "six-char password text: $(grep -c 'At least 6 characters' /tmp/live.js)"
                echo "admin 12-char text: $(grep -c 'At least 12 characters' /tmp/live.js)"
                echo "vacancy team 12-char message: $(grep -c 'The password must be at least 12 characters.' /tmp/live.js)"
                grep -o 'Password must be at least ${[^}]*} characters.' /tmp/live.js | sort -u
              fi
            done
            if [ "$found" = "1" ]; then
              echo 'LIVE SITE VERIFIED'
              exit 0
            fi
            echo "attempt $attempt: the 6-character bundle is not live yet"
            sleep 20
          done
          echo 'TIMED OUT waiting for the deploy'
          exit 1
