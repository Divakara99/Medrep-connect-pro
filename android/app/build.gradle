apply plugin: 'com.android.application'

// Release signing comes from android/keystore.properties locally, or from
// environment variables in CI (GitHub Actions decodes the keystore from
// secrets). The keystore and this properties file are NEVER committed — see
// ANDROID.md ("Upload key") for generation, secrets and backup. Debug builds
// always use the standard debug key.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def releaseStoreFile = System.getenv("ANDROID_KEYSTORE_PATH") ?: keystoreProps.getProperty("storeFile")
def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: keystoreProps.getProperty("storePassword")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: keystoreProps.getProperty("keyAlias")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: keystoreProps.getProperty("keyPassword")

android {
    namespace = "in.medrepconnect.app"
    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "in.medrepconnect.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 8
        versionName "1.0.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // `aaptOptions` is deprecated in AGP 8 and removed in AGP 9; the
        // equivalent block lives under androidResources.
        androidResources {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            // R8 on: Play flags bundles whose DEX has 0% obfuscation ("DEX code
            // optimization below threshold", fix by Feb 2027) and throttles
            // publishing. The keep rules in proguard-rules.pro protect the
            // reflection-heavy parts (Capacitor plugins, AdMob, Play Billing).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Applies only when a keystore is configured (above). In CI an
            // unsigned bundle fails the "Verify signing" step instead of
            // silently shipping uninstallable.
            if (releaseStoreFile) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Declared explicitly: MainActivity pads the WebView by the real system-bar
    // insets (ViewCompat / WindowInsetsCompat) and opts into edge-to-edge with
    // EdgeToEdge. Relying on these arriving transitively through appcompat is
    // how the earlier WindowCompat fix failed to compile.
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
